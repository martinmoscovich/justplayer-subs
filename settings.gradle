plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
include ':app', ':doubletapplayerview', 'android-file-chooser'

// Subtitle engine: its own repository (github.com/martinmoscovich/subtitle-engine), checked out as a
// sibling of this fork and included here as a Gradle module. Pure JVM, no Android deps. Gradle
// ignores the engine's own settings.gradle.kts when it is included this way, so the engine keeps
// building standalone from its repo. Run bootstrap.bat in the workspace to lay out the siblings.
include ':subtitle-engine'
project(':subtitle-engine').projectDir = new File(settingsDir, '../subtitle-engine')

rootProject.name = "Player"