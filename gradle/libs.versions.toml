[versions]
okhttp = "4.12.0"
gson = "2.11.0"
# ONNX Runtime for Silero VAD. The desktop artifact (onnxruntime) drives JVM tests/CLI; the Android
# app pulls onnxruntime-android of the same version on device.
onnxruntime = "1.20.0"
lombok = "1.18.36"
mockito = "5.12.0"
# JUnit 5 (Jupiter) for the pure-JVM subtitle-engine module.
junitJupiter = "5.10.2"
# JUnit Platform launcher — Gradle 9 no longer adds it implicitly; needed on the test runtime classpath.
junitPlatform = "1.10.2"

[libraries]
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
onnxruntime = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
