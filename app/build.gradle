plugins {
    id 'com.android.application'
}

// OTA distribution settings. They can be overridden for a fork/CI build with -PotaReleaseBaseUrl
// and -PotaApkFileName without requiring a Java source change.
def otaReleaseBaseUrl = providers.gradleProperty("otaReleaseBaseUrl")
        .getOrElse("https://github.com/martinmoscovich/justplayer-subs/releases/latest/download")
        .replaceAll('/+$', '')
def otaApkFileName = providers.gradleProperty("otaApkFileName").getOrElse("SubPlayer.apk")
def otaVersionFileName = providers.gradleProperty("otaVersionFileName").getOrElse("version.json")
// Keep the configured version as the major part and reserve six decimal digits for the DEBUG
// timestamp. This guarantees every build of version N is below every build of version N+1.
final long debugVersionMultiplier = 1_000_000L
def otaSemanticVersionCode = null
def debugBuildVersionCode = null
def effectiveDebugVersionCode = {
    if (debugBuildVersionCode == null) {
        long baseVersionCode = otaSemanticVersionCode
        long timestampPart = (System.currentTimeMillis() / 1000L) % debugVersionMultiplier
        long effectiveCode = baseVersionCode * debugVersionMultiplier + timestampPart
        if (effectiveCode > Integer.MAX_VALUE) {
            throw new GradleException("versionCode demasiado alto para el esquema DEBUG OTA")
        }
        debugBuildVersionCode = effectiveCode as int
    }
    debugBuildVersionCode
}

android {
    namespace 'com.brouken.player'
    compileSdk = 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        def abiFilter = project.findProperty("abiFilter")
        applicationId "com.brouken.player"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 215
        otaSemanticVersionCode = versionCode
        versionName "0.${versionCode}"
        buildConfigField "String", "OTA_RELEASE_BASE_URL", "\"${otaReleaseBaseUrl}\""
        buildConfigField "String", "OTA_APK_FILE_NAME", "\"${otaApkFileName}\""
        buildConfigField "String", "OTA_VERSION_FILE_NAME", "\"${otaVersionFileName}\""
        buildConfigField "long", "OTA_DEBUG_VERSION_MULTIPLIER", "${debugVersionMultiplier}L"
        if (abiFilter) {
            def abiCodeMap = ["x86": 1, "x86_64": 2, "armeabi-v7a": 3, "arm64-v8a": 4]
            versionCode = versionCode * 10 + abiCodeMap[abiFilter]
            ndk {
                abiFilters abiFilter
            }
        }
    }
    base {
        archivesName = "Just.Player.v${defaultConfig.versionName}"
    }
    buildTypes {
        release {
            minifyEnabled false
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "targetSdk", "distribution"
    productFlavors {
        latest {
            dimension "targetSdk"
        }
        legacy {
            dimension "targetSdk"
            versionCode = defaultConfig.versionCode + 1_000_000
            versionNameSuffix "-legacy"
            targetSdkVersion 29
        }

        universal {
            dimension "distribution"
        }
        amazon {
            dimension "distribution"
        }
        accrescent {
            dimension "distribution"
        }
    }
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("legacy") && (names.contains("amazon") || names.contains("accrescent"))) {
            setIgnore(true)
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "debug") {
            variant.outputs.all { output ->
                output.versionCodeOverride = effectiveDebugVersionCode()
            }
        }
        // The OTA endpoint always points at this asset name. Keeping it independent from the
        // version also makes GitHub's /releases/latest/download URL usable.
        if (variant.flavorName == "latestUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = otaApkFileName
            }
        }
        if (variant.buildType.name == "release" && variant.flavorName == "legacyUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}-legacy.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        disable 'MissingTranslation'
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    def media3_version = '1.11.0-rc01'
    def androidxCoreVersion = '1.8.0'
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation("androidx.media3:media3-exoplayer-dash:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-rtsp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.sigpwned:chardet4j:78.1.0'
    implementation project(path: ':doubletapplayerview')
    implementation project(path: ':android-file-chooser')
    implementation fileTree(dir: "libs", include: ["lib-*.aar"])

    // Subtitle engine (pure JVM). Exclude the desktop ONNX runtime it pulls for its CLI: it carries
    // native libraries for every desktop platform and must not land in the APK. The app provides the
    // Android build of ONNX below instead (see the engine's README).
    implementation(project(':subtitle-engine')) {
        exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime'
    }
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    // QR setup screen: a tiny local HTTP server (NanoHTTPD) and a QR encoder (ZXing core, encode-only —
    // no camera/Android dependency needed on this side).
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'

    // Same JUnit 5 version subtitle-engine pins (see justplayer/gradle/libs.versions.toml), so the
    // workspace isn't running two versions of JUnit.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// A configuration-cache entry would retain the timestamp calculated above. DEBUG tasks therefore
// opt out so every invocation configures a new versionCode; RELEASE tasks remain cache-compatible.
tasks.configureEach {
    if (name.toLowerCase().contains("debug")) {
        notCompatibleWithConfigurationCache("DEBUG builds use the current timestamp as versionCode.")
    }
}

// Produces the two assets to attach to a GitHub Release. Debug is the current default; when the
// project moves to release signing, use -PotaBuildType=release with the same task and protocol.
def otaBuildType = providers.gradleProperty("otaBuildType").getOrElse("debug")
def otaBuildTypeCapitalized = otaBuildType.capitalize()
def otaApk = layout.buildDirectory.file("outputs/apk/latestUniversal/${otaBuildType}/${otaApkFileName}")
def otaAssetsDir = layout.buildDirectory.dir("ota-release-assets")
def otaVersionJson = otaAssetsDir.map { it.file(otaVersionFileName) }
def otaVersionName = android.defaultConfig.versionName.toString()
def otaVersionCode = otaBuildType == "debug" ? effectiveDebugVersionCode() : android.defaultConfig.versionCode

def generateOtaVersionJson = tasks.register("generateOtaVersionJson") {
    inputs.property("versionName", otaVersionName)
    inputs.property("versionCode", otaVersionCode)
    outputs.file(otaVersionJson)

    doLast {
        def versionFile = otaVersionJson.get().asFile
        versionFile.parentFile.mkdirs()
        versionFile.text = "{\n  \"versionName\": \"${otaVersionName}\",\n  \"versionCode\": ${otaVersionCode}\n}\n"
    }
}

tasks.register("prepareOtaReleaseAssets", Copy) {
    dependsOn "assembleLatestUniversal${otaBuildTypeCapitalized}"
    from(otaApk)
    into(otaAssetsDir)
    finalizedBy(generateOtaVersionJson)
}
